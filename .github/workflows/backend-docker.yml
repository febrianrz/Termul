name: Backend Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Normalizes DOCKER_REGISTRY (strips a scheme like "https://" and any
      # trailing slash, in case it was entered as a full URL - docker login
      # tolerates that but a raw image reference does not) and computes the
      # namespace segment of the image path. That namespace must be
      # lowercase and can't contain "@" or other special characters, but
      # some registries (e.g. Harbor) log in with an email address - set
      # DOCKER_IMAGE_NAMESPACE to override it explicitly (e.g. to your
      # Harbor "project" name); otherwise it's derived from DOCKER_USERNAME
      # by dropping anything after "@" and sanitizing it.
      - name: Compute registry and image name
        id: image
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          NAMESPACE: ${{ secrets.DOCKER_IMAGE_NAMESPACE }}
        run: |
          registry=$(printf '%s' "$REGISTRY" | tr -d '[:space:]' | sed -e 's~^[a-zA-Z][a-zA-Z0-9+.-]*://~~' -e 's~/*$~~')

          namespace="$NAMESPACE"
          if [ -z "$namespace" ]; then
            namespace=$(printf '%s' "$USERNAME" | cut -d@ -f1 | tr -d '\n' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed -e 's/^-*//' -e 's/-*$//')
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          if [ -n "$registry" ]; then
            echo "name=$registry/$namespace/termul-backend" >> "$GITHUB_OUTPUT"
          else
            echo "name=$namespace/termul-backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
