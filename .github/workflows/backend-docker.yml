name: Backend Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Normalizes DOCKER_REGISTRY (strips a scheme like "https://" and any
      # trailing slash, in case it was entered as a full URL - docker login
      # tolerates that but a raw image reference does not) and computes the
      # image name.
      #
      # Namespace (the "project"/"org" segment before the image name) is only
      # added when DOCKER_IMAGE_NAMESPACE is explicitly set - e.g. Harbor's
      # project name, or Docker Hub, which requires a namespace and has none
      # of its own to fall back on so DOCKER_USERNAME is used there instead.
      # A self-hosted registry that stores images as flat repositories
      # doesn't need one at all, so it's left out unless asked for.
      - name: Compute registry and image name
        id: image
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          NAMESPACE: ${{ secrets.DOCKER_IMAGE_NAMESPACE }}
        run: |
          sanitize() {
            printf '%s' "$1" | cut -d@ -f1 | tr -d '\n\r' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed -e 's/^-*//' -e 's/-*$//'
          }

          registry=$(printf '%s' "$REGISTRY" | tr -d '[:space:]' | sed -e 's~^[a-zA-Z][a-zA-Z0-9+.-]*://~~' -e 's~/*$~~')

          namespace=""
          if [ -n "$NAMESPACE" ]; then
            namespace=$(sanitize "$NAMESPACE")
          elif [ -z "$registry" ]; then
            # No custom registry means Docker Hub, which requires a namespace.
            namespace=$(sanitize "$USERNAME")
          fi

          if [ -n "$registry" ]; then
            if [ -n "$namespace" ]; then
              name="$registry/$namespace/termul-backend"
            else
              name="$registry/termul-backend"
            fi
          else
            name="$namespace/termul-backend"
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          echo "DEBUG registry=[$registry] (len ${#registry})"
          echo "DEBUG namespace=[$namespace] (len ${#namespace})"
          echo "DEBUG name=[$name]"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # Only runs once the new image has actually been pushed. The webhook
      # URL itself (including its token) is a secret - it must never be
      # hardcoded here, since anyone with it can trigger a deploy.
      - name: Trigger Dokploy deploy
        if: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK != '' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
