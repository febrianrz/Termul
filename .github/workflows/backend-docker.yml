name: Backend Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Normalizes DOCKER_REGISTRY (strips a scheme like "https://" and any
      # trailing slash, in case it was entered as a full URL - docker login
      # tolerates that but a raw image reference does not) and computes the
      # namespace segment of the image path. That namespace must be
      # lowercase and can't contain "@" or other special characters. It
      # comes from DOCKER_IMAGE_NAMESPACE if set (e.g. a Harbor "project"
      # name), otherwise from DOCKER_USERNAME with anything after "@"
      # dropped - either way it's sanitized the same way.
      - name: Compute registry and image name
        id: image
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          NAMESPACE: ${{ secrets.DOCKER_IMAGE_NAMESPACE }}
        run: |
          sanitize() {
            printf '%s' "$1" | cut -d@ -f1 | tr -d '\n\r' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed -e 's/^-*//' -e 's/-*$//'
          }

          registry=$(printf '%s' "$REGISTRY" | tr -d '[:space:]' | sed -e 's~^[a-zA-Z][a-zA-Z0-9+.-]*://~~' -e 's~/*$~~')

          namespace_source="$NAMESPACE"
          if [ -z "$namespace_source" ]; then
            namespace_source="$USERNAME"
          fi
          namespace=$(sanitize "$namespace_source")

          if [ -n "$registry" ]; then
            name="$registry/$namespace/termul-backend"
          else
            name="$namespace/termul-backend"
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          echo "DEBUG registry=[$registry] (len ${#registry})"
          echo "DEBUG namespace=[$namespace] (len ${#namespace})"
          echo "DEBUG name=[$name]"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
