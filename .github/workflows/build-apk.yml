name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify ALTER_CLIENT_ID secret is set
        run: |
          if [ -z "${{ secrets.ALTER_CLIENT_ID }}" ]; then
            echo "::error::Repository secret ALTER_CLIENT_ID is not set. Without it the APK is built with an empty client_id, and SSO login fails with a confusing 'unsupported_grant_type' error from the SSO server. Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build release APK
        env:
          SSO_CLIENT_ID: ${{ secrets.ALTER_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          # The "latest" release is continuously replaced by every push, so
          # pubspec.yaml's fixed version alone can't tell two APKs apart.
          # Stamp the CI run number as the build number, shown in Settings.
          args+=(--build-number="${{ github.run_number }}")
          flutter build apk --release "${args[@]}"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: termul-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          # The in-app update checker (lib/services/update_checker.dart)
          # parses "(build N)" out of this body to compare against the
          # installed app's own build number - keep that text if you edit
          # this.
          body: >-
            Automatically rebuilt from the latest push to
            ${{ github.ref_name }} (build ${{ github.run_number }}).
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify ALTER_CLIENT_ID secret is set
        run: |
          if [ -z "${{ secrets.ALTER_CLIENT_ID }}" ]; then
            echo "::error::Repository secret ALTER_CLIENT_ID is not set. Without it the build is compiled with an empty client_id, and SSO login fails with a confusing 'unsupported_grant_type' error from the SSO server. Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Unsigned build: validates the app compiles for iOS. It does not
      # produce an installable IPA - that needs an Apple Developer account,
      # a signing certificate, and a provisioning profile (not set up yet).
      - name: Build iOS (no code signing)
        env:
          SSO_CLIENT_ID: ${{ secrets.ALTER_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          args+=(--build-number="${{ github.run_number }}")
          flutter build ios --release --no-codesign "${args[@]}"
