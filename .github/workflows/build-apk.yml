name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SSO_CLIENT_ID: ${{ secrets.SSO_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          # Without this guard, a missing/empty secret silently bakes an
          # empty client_id into the APK - the app builds fine, uploads
          # fine, and only fails at login (as "unsupported_grant_type" or
          # similar, from the SSO server rejecting the blank client_id)
          # with nothing in this log pointing at the real cause.
          if [ -z "$SSO_CLIENT_ID" ]; then
            echo "::error::SSO_CLIENT_ID secret is empty or not set - the built APK's login would silently send no client_id. Set it in Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          # --split-per-abi: a single "fat" APK bundles native libs for every
          # CPU architecture (~75MB), which is slow to download on mobile
          # data and more prone to stalling mid-download. Splitting produces
          # one APK per architecture (~20-30MB each) - almost every real
          # phone downloads the arm64-v8a one.
          flutter build apk --release --split-per-abi "${args[@]}"

      - name: Upload APKs (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: termul-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: >
            Automatically rebuilt from the latest push to ${{ github.ref_name }}.
            Most phones (2019+) should download app-arm64-v8a-release.apk.
            Older 32-bit devices need app-armeabi-v7a-release.apk instead.
          make_latest: true
          files: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Unsigned build: validates the app compiles for iOS. It does not
      # produce an installable IPA - that needs an Apple Developer account,
      # a signing certificate, and a provisioning profile (not set up yet).
      - name: Build iOS (no code signing)
        env:
          SSO_CLIENT_ID: ${{ secrets.SSO_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$SSO_CLIENT_ID" ]; then
            echo "::error::SSO_CLIENT_ID secret is empty or not set - the built app's login would silently send no client_id. Set it in Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          flutter build ios --release --no-codesign "${args[@]}"
