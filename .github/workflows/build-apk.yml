name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) so the changelog
          # step below can diff against the previous "latest" tag.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify ALTER_CLIENT_ID secret is set
        run: |
          if [ -z "${{ secrets.ALTER_CLIENT_ID }}" ]; then
            echo "::error::Repository secret ALTER_CLIENT_ID is not set. Without it the APK is built with an empty client_id, and SSO login fails with a confusing 'unsupported_grant_type' error from the SSO server. Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the release APK will be signed with the debug key instead of a dedicated release key. See README's 'Android release signing' section for how to generate and configure one."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        env:
          SSO_CLIENT_ID: ${{ secrets.ALTER_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          # The "latest" release is continuously replaced by every push, so
          # pubspec.yaml's fixed version alone can't tell two APKs apart.
          # Stamp the CI run number as the build number, shown in Settings.
          args+=(--build-number="${{ github.run_number }}")
          # Almost every real Android device sold since ~2017 is arm64; a
          # universal build bundles armeabi-v7a/x86/x86_64 native code too,
          # which roughly triples the APK size for a near-zero audience.
          args+=(--target-platform android-arm64)
          flutter build apk --release "${args[@]}"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: termul-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build changelog since last release
        id: changelog
        run: |
          if git rev-parse --verify --quiet 'refs/tags/latest^{commit}' >/dev/null; then
            log=$(git log 'refs/tags/latest..HEAD' --no-merges --pretty='format:- %s (%h)')
          else
            log=$(git log -20 --no-merges --pretty='format:- %s (%h)')
          fi
          if [ -z "$log" ]; then
            log="- No new commits since the last release."
          fi
          {
            echo "log<<TERMUL_CHANGELOG_EOF"
            echo "$log"
            echo "TERMUL_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          # The in-app update checker (lib/services/update_checker.dart)
          # parses "(build N)" out of this body to compare against the
          # installed app's own build number - keep that text if you edit
          # this.
          body: |
            Automatically rebuilt from the latest push to ${{ github.ref_name }} (build ${{ github.run_number }}).

            Commits in this build (since the last release):
            ${{ steps.changelog.outputs.log }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify ALTER_CLIENT_ID secret is set
        run: |
          if [ -z "${{ secrets.ALTER_CLIENT_ID }}" ]; then
            echo "::error::Repository secret ALTER_CLIENT_ID is not set. Without it the build is compiled with an empty client_id, and SSO login fails with a confusing 'unsupported_grant_type' error from the SSO server. Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Unsigned build: validates the app compiles for iOS. It does not
      # produce an installable IPA - that needs an Apple Developer account,
      # a signing certificate, and a provisioning profile (not set up yet).
      - name: Build iOS (no code signing)
        env:
          SSO_CLIENT_ID: ${{ secrets.ALTER_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          args+=(--build-number="${{ github.run_number }}")
          flutter build ios --release --no-codesign "${args[@]}"
