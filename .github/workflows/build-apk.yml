name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SSO_CLIENT_ID: ${{ secrets.SSO_CLIENT_ID }}
          SSO_BASE_URL: ${{ vars.SSO_BASE_URL }}
          SSO_REDIRECT_URI: ${{ vars.SSO_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          args=(--dart-define=SSO_CLIENT_ID="$SSO_CLIENT_ID")
          [ -n "$SSO_BASE_URL" ] && args+=(--dart-define=SSO_BASE_URL="$SSO_BASE_URL")
          [ -n "$SSO_REDIRECT_URI" ] && args+=(--dart-define=SSO_REDIRECT_URI="$SSO_REDIRECT_URI")
          [ -n "$BACKEND_BASE_URL" ] && args+=(--dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL")
          flutter build apk --release "${args[@]}"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: termul-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically rebuilt from the latest push to ${{ github.ref_name }}.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
